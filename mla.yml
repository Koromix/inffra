- name: System configuration
  hosts: all
  roles:
    - name: base
    - name: nginx
      when: 'nginx_domains is defined'
    - name: prometheus
      when: 'prometheus_exporters is defined or grafana_url is defined'
  tags: [global]

- name: Public Globaleaks
  hosts: leaks
  roles:
    - name: globaleaks
  tags: [specific]

- name: Public WordPress
  hosts: public
  roles:
    - name: mariadb
    - name: wordpress
  tags: [specific]

- name: Private Nextcloud
  hosts: vault
  roles:
    - name: mariadb
    - name: nextcloud
  tags: [specific]
