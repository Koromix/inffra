- name: Global configuration
  hosts: all
  roles:
    - name: base
    - name: rclone
      when: 'rclone_directories is defined'
    - name: nginx
      when: 'nginx_domains is defined'
    - name: prometheus
      when: 'prometheus_exporters is defined or grafana_url is defined'
  tags: [global]

- import_playbook: config/services/ztncui.yml
- import_playbook: config/services/discourse.yml
- import_playbook: config/services/cryptpad.yml
- import_playbook: config/services/globaleaks.yml
- import_playbook: config/services/mattermost.yml
- import_playbook: config/services/nextcloud.yml
- import_playbook: config/services/vaultwarden.yml
- import_playbook: config/services/wekan.yml
- import_playbook: config/services/wireguard.yml
- import_playbook: config/services/wordpress.yml
