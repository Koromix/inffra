- name: Global configuration
  hosts: all
  roles:
    - name: base
    - name: nginx
      when: 'nginx_domains is defined'
    - name: prometheus
      when: 'prometheus_exporters is defined or grafana_url is defined'
  tags: [global]

- name: Public Globaleaks
  hosts: leaks
  roles:
    - name: globaleaks
  tags: [specific]

