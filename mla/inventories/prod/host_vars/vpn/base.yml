ansible_host: 57.128.60.175
ansible_port: 22
ansible_user: debian
ansible_python_interpreter: /usr/bin/python3

ufw_rules:
  - rule: allow
    port: 22
    proto: tcp
  - rule: allow
    port: 53
  - rule: allow
    port: 80
    proto: tcp
  - rule: allow
    port: 443
    proto: tcp
  - rule: allow
    port: 51820
    proto: udp
  - rule: allow
    port: 60000:61000
    proto: udp

dns_server: yes
dns_authorities:
  - name: '{{ private_domain }}'
    mail: 'admin@{{ private_domain }}'
dns_le_accounts:
  main: niels.martignene@protonmail.com
