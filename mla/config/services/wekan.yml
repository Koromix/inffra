- name: Private Wekan
  hosts: pri_tools
  roles:
    - role: ../../../../roles/mongodb
      vars:
        mongodb_version: 6.0
        mongodb_key_id: 64C3C388
    - role: ../../../../roles/wekan
      vars:
        wekan_name: team
        wekan_root: 'https://wekan.{{ private_domain }}'
        wekan_database: 'mongodb://127.0.0.1:27017/wk_team'
        wekan_smtp: '{{ smtp }}'
  tags: [wekan]
