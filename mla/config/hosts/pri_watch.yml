dns_domains:
  - name: 'watch.{{ private_domain }}'
    ssl_agnos_account: main

nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      ssl_client_certificate /opt/nginx/ssl/internal/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;

      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.pri_watch.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: 'watch.{{ private_domain }}'
    ssl_file_crt: '/opt/certificates/watch.{{ private_domain }}.crt'
    ssl_file_key: '/opt/certificates/watch.{{ private_domain }}.key'
    config: |
      location / {
          limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:9200;
      }

prometheus_exporters:
  - node_exporter
  - nginx_exporter
  - systemd_exporter

