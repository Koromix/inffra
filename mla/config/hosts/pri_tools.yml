dns_domains:
  - name: 'wekan.{{ private_domain }}'
    ssl_agnos_account: main
  - name: 'vault.{{ private_domain }}'
    ssl_agnos_account: main

nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      ssl_client_certificate /opt/nginx/ssl/internal/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;

      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.pri_watch.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: 'wekan.{{ private_domain }}'
    ssl_file_crt: '/opt/certificates/wekan.{{ private_domain }}.crt'
    ssl_file_key: '/opt/certificates/wekan.{{ private_domain }}.key'
    config: |
      location / {
          limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval'";

          proxy_pass http://127.0.0.1:6789;
      }

  - name: 'vault.{{ private_domain }}'
    ssl_file_crt: '/opt/certificates/vault.{{ private_domain }}.crt'
    ssl_file_key: '/opt/certificates/vault.{{ private_domain }}.key'
    config: |
      location / {
          limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:8285;
      }

prometheus_exporters:
  - node_exporter
  - nginx_exporter
  - systemd_exporter
