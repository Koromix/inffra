          username: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            30383035653036313039383165616463626138303164386562373961646235343837303463633039
            6637613537333566616564363464626465663465323063630a616231386561663765336462333866
            36303065613238666165336261626334646539323365613030373739356163613932303830666530
            3533353538613130350a373232366636343834313733666463393538376366656330323263623364
            3833
          password: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            38353739663935376165623130613838326262643464643464633537303639333338656530616537
            3539363238336432356662396264383765643033653433340a313961373864376532396533303830
            34393462643635623965353234386132303763653330356638376161383564343461373835303137
            3939613438663565630a323233363537313064383339613131326534333437303233343531346337
            61386432643032626661313933346262313738656662333361656666616637636532
