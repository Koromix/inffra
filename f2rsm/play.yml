- name: Global configuration
  hosts: all
  roles:
    - name: base
    - name: nginx
      when: 'nginx_domains is defined'
    - name: prometheus
      when: 'prometheus_exporters is defined or grafana_url is defined'
  tags: [system]

- name: Rekkord
  hosts: all
  roles:
    - name: rekkord
      when: 'rekkord_paths is defined'
  tags: [system, rekkord]

- import_playbook: 'services/forgejo.yml'
- import_playbook: 'services/limesurvey.yml'
- import_playbook: 'services/redropp.yml'
