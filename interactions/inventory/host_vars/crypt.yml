nginx_config_misc: |
  map $upstream_http_content_security_policy $ldv_csp {
      '' "base-uri 'none'; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'";
  }

nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.watch.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: vault.interactions-team.fr
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          # limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:8286;
      }

  - name: drop.interactions-team.fr
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Remote-Port $remote_port;

          proxy_redirect off;
          proxy_pass http://127.0.0.1:12001;
      }

prometheus_exporters:
  - node_exporter
  - nginx_exporter
  - systemd_exporter
