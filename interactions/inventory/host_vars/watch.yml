ansible_host: 10.147.18.170
ansible_port: 22
ansible_user: debian
ansible_python_interpreter: /usr/bin/python3

ufw_rules:
  - rule: allow
    to: '{{ ansible_host }}'
    port: 22
    proto: tcp
  - rule: allow
    port: 80
    proto: tcp
  - rule: allow
    port: 443
    proto: tcp
  - rule: allow
    port: 9993
    proto: udp
  - rule: allow
    port: 51820
    proto: udp

rekkord_directories:
  - name: '{{ inventory_hostname }}/opt'
    src: /opt

nginx_mode: back
nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.watch.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

      {% if blackbox_sites is defined %}

      location /metrics/probe {
          allow {{ hostvars.watch.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:{{ prometheus_packages.blackbox_exporter.port }}/probe$is_args$args;
      }
      {% endif %}

  - name: watch.interactions-team.fr
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          # limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:9200;
      }

prometheus_exporters:
  - node_exporter
  - nginx_exporter
  - systemd_exporter
#   - blackbox_exporter

