nginx_mode: back
nginx_config_misc: |
  map $upstream_http_content_security_policy $ldv_csp {
      '' "base-uri 'none'; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'";
  }

nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

