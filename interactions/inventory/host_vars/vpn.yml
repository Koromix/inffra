ansible_host: 10.147.18.38
ansible_port: 22
ansible_user: debian
ansible_python_interpreter: /usr/bin/python3

nginx_relay: 10.10.10.5

ufw_rules:
  - rule: allow
    to: '{{ ansible_host }}'
    port: 22
    proto: tcp
  - rule: allow
    port: 80
    proto: tcp
  - rule: allow
    port: 443
    proto: tcp
  - rule: allow
    port: 9993
    proto: udp
  - rule: allow
    port: 51820
    proto: udp

rekkord_directories:
  - name: '{{ inventory_hostname }}/opt'
    src: /opt

nginx_mode: back
nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.watch.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: vpn.interactions-team.fr
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          proxy_pass http://127.0.0.1:51821/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "Upgrade";
          proxy_set_header Host $host;
      }

prometheus_exporters:
  - node_exporter
  - nginx_exporter
  - systemd_exporter
