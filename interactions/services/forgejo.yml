- name: Forgejo
  hosts: git
  roles:
    - role: ../roles/forgejo
      vars:
        forgejo_name: INTERACTIONS
        forgejo_domain: git.interactions-team.fr
        forgejo_smtp:
          host: mail.smtp2go.com:587
          username: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            37653766366462306139623138303663353565346438633931346165363739333635636261363730
            3735626263366464353739666363346363383065366439660a633834363938666131666661626664
            63303361373433656662643638303738613837646330366237303535633632643364623038633565
            6363363537616333300a366366656130656535326363333736623366343837313762333461626134
            6164
          password: !vault |
            $ANSIBLE_VAULT;1.1;AES256
            37323236313039643230303365363532303031323861613836343263663235326639393638313434
            3031313530663762396533303430306561376639323435330a326634633631326465363666636239
            65336432626162653566633266383930373139393734366162333035663439346339646564643763
            6564376564393761390a356466613864333366316263346537326434303738626163323035663563
            34613030393761616462353565643264616333356664373037386166383362643235
          from: nepasrepondre@interactions-team.fr
          protocol: smtp+starttls
        forgejo_config:
          server: |
            START_SSH_SERVER = true
            BUILTIN_SSH_SERVER_USER = git
            SSH_LISTEN_PORT = 2222
          i18n: |
            LANGS = fr-FR,en-US
            NAMES = Français,English
          service: |
            ENABLE_INTERNAL_SIGNIN = false
            DISABLE_REGISTRATION = true
            SEND_NOTIFICATION_EMAIL_ON_NEW_USER = true
            REGISTER_EMAIL_CONFIRM = false
            REGISTER_MANUAL_CONFIRM = false
            REQUIRE_SIGNIN_VIEW = false
          repository: |
            DISABLE_DOWNLOAD_SOURCE_ARCHIVES = true
          oauth2_client: |
            ENABLE_AUTO_REGISTRATION = true
            ACCOUNT_LINKING = auto
  tags: [forgejo]
