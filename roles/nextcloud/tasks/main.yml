- name: Fetch SURY repository key
  get_url:
    url: https://packages.sury.org/php/apt.gpg
    dest: /usr/share/keyrings/deb.sury.org-php.gpg
  become: yes

- name: Configure SURY repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - php8.2-cli
      - php8.2-mysql
      - php8.2-curl
      - php8.2-gd
      - php8.2-intl
      - php8.2-xml
      - php8.2-mbstring
      - php8.2-zip
      - php8.2-fpm
      - php8.2-memcache
      - php8.2-apcu
      - php8.2-gmp
      - php8.2-bcmath
      - php8.2-imagick
      - php8.2-redis
      - redis-server
      - bzip2
      - acl
    state: latest
  become: yes

- name: Prepare Nextcloud base directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ nextcloud_root_path }}'
    - '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
  become: yes

- name: Read installed Nextcloud checksum
  block:
    - name: Read installed Nextcloud checksum 1/2
      stat:
        path: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/checksum'
      register: checksum1
      become: yes
    - name: Read installed Nextcloud checksum 2/2
      slurp:
        src: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/checksum'
      register: checksum2
      when: 'checksum1.stat.exists'
      become: yes

- name: Clear out old Nextcloud files
  file:
    path: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/new'
    state: absent
  when: 'not checksum1.stat.exists or (checksum2.content | b64decode) != nextcloud_checksum'
  become: yes

- name: Create Nextcloud directories
  file:
    path: '{{ item }}'
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop:
    - '{{ nextcloud_root_path }}/{{ nextcloud_name }}/new'
    - '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live'
  become: yes

- name: Fetch Nextcloud archive
  get_url:
    url: '{{ nextcloud_url }}'
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}.tar.bz2'
    checksum: '{{ nextcloud_checksum }}'
  become: yes

- name: Extract Nextcloud archive
  unarchive:
    src: '{{ nextcloud_root_path }}/{{ nextcloud_name }}.tar.bz2'
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/new'
    remote_src: yes
    owner: www-data
    group: www-data
    mode: 'u=rwX,g=rX,o=rX'
    extra_opts:
      - '--strip-components=1'
  when: 'not checksum1.stat.exists or (checksum2.content | b64decode) != nextcloud_checksum'
  become: yes

- name: Write Nextcloud checksum
  copy:
    content: '{{ nextcloud_checksum }}'
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/checksum'
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Check for existing Nextcloud install
  stat:
    path: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live/config/config.php'
  register: install_check
  become: yes

- name: Copy Nextcloud install
  shell:
    cmd: rsync -av new/ live/
    chdir: '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
  when: 'not install_check.stat.exists'
  become: yes

- name: Configure Nextcloud install
  shell:
    cmd: |
      /usr/bin/php8.2 occ maintenance:install \
        --database "{{ nextcloud_database.provider }}" --database-host "{{ nextcloud_database.host }}" \
        --database-name "{{ nextcloud_database.name }}" \
        --database-user "{{ nextcloud_database.user }}" --database-pass "{{ nextcloud_database.password }}" \
        --admin-user "{{ nextcloud_default_user }}" --admin-pass "{{ nextcloud_default_password }}"
      rm -f config/CAN_INSTALL
      chmod 555 .
    chdir: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live'
  when: 'not install_check.stat.exists'
  become: yes
  become_user: www-data

- name: Synchronize new Nextcloud version
  shell:
    cmd: rsync -av --delete --exclude=/config --exclude=/data --exclude=/custom_apps new/ live/
    chdir: '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
  when: 'install_check.stat.exists'
  become: yes

- name: Upgrade Nextcloud
  shell:
    cmd: '/usr/bin/php8.2 --define apc.enable_cli=1 occ upgrade'
    chdir: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live'
  when: 'install_check.stat.exists'
  become: yes
  become_user: www-data

- name: Set Nextcloud trusted domains
  lineinfile:
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live/config/config.php'
    regexp: "^ *0 => "
    line: "    0 => '{{ nextcloud_domain }}'"
    state: present
  become: yes

- name: Adjust Nextcloud settings
  lineinfile:
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live/config/config.php'
    regexp: "'{{ item.key }}'"
    line: "  '{{ item.key }}' => {{ item.value }},"
    insertbefore: '^\);'
  loop:
    - key: memcache.local
      value: "'\\OC\\Memcache\\APCu'"
    - key: memcache.distributed
      value: "'\\OC\\Memcache\\Redis'"
    - key: memcache.locking
      value: "'\\OC\\Memcache\\Redis'"
    - key: redis
      value: "['host' => 'localhost', 'port' => 6379]"
    - key: overwrite.cli.url
      value: "'https://{{ nextcloud_domain }}'"
  become: yes

- name: Configure SMTP include
  lineinfile:
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live/config/config.php'
    regexp: "^ *include\\('smtp\\.php'\\);"
    line: "include('smtp.php');"
    state: '{{ "present" if nextcloud_smtp is defined else "absent" }}'
  become: yes

- name: Configure SMTP server
  template:
    src: smtp.php.j2
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/live/config/smtp.php'
    owner: www-data
    group: www-data
    mode: '0755'
  when: 'nextcloud_smtp is defined'
  become: yes

- name: Configure PHP-FPM pool
  template:
    src: fpm.conf.j2
    dest: /etc/php/8.2/fpm/pool.d/nextcloud.conf
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Restart PHP-FPM service
  service:
    name: php8.2-fpm
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Install periodic task systemd units
  template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - nextcloud_cron@.service
    - nextcloud_cron@.timer
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Enabled periodic task units
  service:
    name: 'nextcloud_cron@{{ nextcloud_name }}.timer'
    state: started
    enabled: yes
  become: yes

- name: Configure OnlyOffice
  include_tasks: onlyoffice.yml
  when: 'onlyoffice_port is defined'
