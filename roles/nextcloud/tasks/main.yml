- name: Configure SURY repository key
  apt_key:
    url: 'https://packages.sury.org/php/apt.gpg'
    id: 95BD4743
    state: present
  become: yes

- name: Configure SURY repository
  apt_repository:
    repo: 'deb https://packages.sury.org/php/ {{ ansible_distribution_release }} main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - php8.2-cli
      - php8.2-mysql
      - php8.2-curl
      - php8.2-gd
      - php8.2-intl
      - php8.2-xml
      - php8.2-mbstring
      - php8.2-zip
      - php8.2-fpm
      - bzip2
      - acl
    state: latest
  become: yes

- name: Prepare Nextcloud base directory
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ nextcloud_root_path }}'
    - '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
  become: yes

- name: Fetch Nextcloud archive
  get_url:
    url: '{{ nextcloud_url }}'
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}.tar.bz2'
    checksum: '{{ nextcloud_checksum }}'
  become: yes

- name: Check for existing Nextcloud install
  stat:
    path: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/config/config.php'
  register: install_check
  become: yes

- name: Install Nextcloud
  unarchive:
    src: '{{ nextcloud_root_path }}/{{ nextcloud_name }}.tar.bz2'
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
    remote_src: yes
    owner: www-data
    group: www-data
    mode: 'u=rwX,g=rX,o=rX'
    extra_opts:
      - '--strip-components=1'
  become: yes

- name: Configure Nextcloud
  shell:
    cmd: |
      /usr/bin/php8.2 occ maintenance:install \
        --database "{{ nextcloud_database.provider }}" --database-name "{{ nextcloud_database.name }}" \
        --database-user "{{ nextcloud_database.user }}" --database-pass "{{ nextcloud_database.password }}" \
        --admin-user "{{ nextcloud_default_user }}" --admin-pass "{{ nextcloud_default_password }}"
      rm -f config/CAN_INSTALL
      chmod 555 .
    chdir: '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
  when: 'not install_check.stat.exists'
  become: yes
  become_user: www-data

- name: Upgrade Nextcloud (just in case)
  shell:
    cmd: |
      /usr/bin/php8.2 occ maintenance:mode --on
      /usr/bin/php8.2 occ upgrade
      /usr/bin/php8.2 occ maintenance:mode --off
      /usr/bin/php8.2 occ integrity:check-core
    chdir: '{{ nextcloud_root_path }}/{{ nextcloud_name }}'
  become: yes
  become_user: www-data

- name: Set Nextcloud trusted domains
  lineinfile:
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/config/config.php'
    regexp: "^ *0 => "
    line: "    0 => '{{ nextcloud_domain }}'"
    state: present
  become: yes

- name: Configure SMTP include
  lineinfile:
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/config/config.php'
    regexp: "^ *include\\('smtp\\.php'\\);"
    line: "include('smtp.php');"
    state: '{{ "present" if nextcloud_smtp is defined else "absent" }}'
  become: yes

- name: Configure SMTP server
  template:
    src: smtp.php.j2
    dest: '{{ nextcloud_root_path }}/{{ nextcloud_name }}/config/smtp.php'
    owner: www-data
    group: www-data
    mode: '0755'
  when: 'nextcloud_smtp is defined'
  become: yes
