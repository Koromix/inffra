nextcloud_url: https://download.nextcloud.com/server/releases/nextcloud-32.0.6.tar.bz2
nextcloud_checksum: 'sha256:44bc33fc0e31a650bb520bb123c0aaa6519b7f7b9386133d561ade77e53f7130'

nextcloud_root_path: /opt/nextcloud

nextcloud_default_user: admin
nextcloud_default_password: admin

# nextcloud_name:
# nextcloud_domain:
# nextcloud_database:

# nextcloud_smtp:

nextcloud_language: en
nextcloud_locale: en_US

nextcloud_fpm_pm: ondemand
nextcloud_fpm_config:
  max_children: 12
  process_idle_timeout: 60s
nextcloud_memory_limit: 512M

onlyoffice_image: onlyoffice/documentserver:9.2.1.1

# onlyoffice_port:
# onlyoffice_jwt_secret:
