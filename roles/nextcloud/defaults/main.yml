nextcloud_url: https://download.nextcloud.com/server/releases/nextcloud-29.0.8.tar.bz2
nextcloud_checksum: 'sha256:0ab54b517f76cd26f2bd38b6fe184b9fbaed32f734246c58c1acf83473c0a4b9'

nextcloud_root_path: /opt/nextcloud

nextcloud_default_user: admin
nextcloud_default_password: admin

# nextcloud_name:
# nextcloud_domain:
# nextcloud_database:

# nextcloud_smtp:

nextcloud_language: en
nextcloud_locale: en_US

nextcloud_fpm_pm: ondemand
nextcloud_fpm_config:
  max_children: 12
  process_idle_timeout: 60s
nextcloud_memory_limit: 512M

onlyoffice_image: onlyoffice/documentserver:8.1.3.2

# onlyoffice_port:
# onlyoffice_jwt_secret:
