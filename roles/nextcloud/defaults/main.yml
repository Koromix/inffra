nextcloud_url: https://github.com/nextcloud-releases/server/releases/download/v34.0.3/nextcloud-34.0.3.tar.bz2
nextcloud_checksum: 'sha256:d7ed36ac0e14a2d9bbd167d6f6d4fc498f0f39fcccdf304e67e35bfc42e4506d'

nextcloud_root_path: /opt/nextcloud

nextcloud_default_user: admin
nextcloud_default_password: admin

# nextcloud_name:
# nextcloud_domain:
# nextcloud_database:

# nextcloud_smtp:

nextcloud_language: en
nextcloud_locale: en_US

nextcloud_fpm_pm: ondemand
nextcloud_fpm_config:
  max_children: 12
  process_idle_timeout: 60s
nextcloud_memory_limit: 512M

onlyoffice_image: onlyoffice/documentserver:9.4.0.1

# onlyoffice_port:
# onlyoffice_jwt_secret:
