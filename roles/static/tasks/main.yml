- name: Fetch SURY repository key
  get_url:
    url: https://packages.sury.org/php/apt.gpg
    dest: /usr/share/keyrings/deb.sury.org-php.gpg
  become: yes

- name: Configure SURY repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_distribution_release }} main'
    state: present
  become: yes

- name: Install packages
  package:
    update_cache: yes
    pkg:
      - git
      - rsync
      - php8.2-cli
      - php8.2-mysql
      - php8.2-curl
      - php8.2-gd
      - php8.2-intl
      - php8.2-xml
      - php8.2-sqlite3
      - php8.2-fpm
      - make
      - curl
      - acl
      - gcc
      - g++
      - nodejs
      - npm
    state: latest
  become: yes

- name: Prepare static directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '0755'
  loop:
    - path: '{{ static_root_path }}'
      owner: root
      group: root
    - path: '{{ static_root_path }}/live'
      owner: www-data
      group: www-data
  become: yes

- name: Prepare static repository directory
  file:
    path: '{{ static_root_path }}/repo/{{ static_name | dirname }}'
    state: directory
    owner: www-data
    group: www-data
  become: yes

- name: Clone repository
  git:
    repo: '{{ static_repo }}'
    version: '{{ static_version | default("master") }}'
    dest: '{{ static_root_path }}/repo/{{ static_name }}'
    depth: 1
    force: yes
  when: 'static_repo is defined'
  become: yes
  become_user: www-data

- name: Create live directory
  file:
    path: '{{ static_root_path }}/live/{{ static_name }}'
    state: directory
    owner: www-data
    group: www-data
    recurse: yes
  become: yes

- name: Run build commands
  command:
    cmd: '{{ item.cmd | default(item) }}'
    chdir: '{{ item.chdir | default(".") }}'
  environment:
    POETRY_HOME: '{{ static_root_path }}/poetry'
    POETRY_CACHE_DIR: '{{ static_root_path }}/poetry/cache'
  loop: '{{ static_build }}'
  when: 'static_build is defined'
  become: yes
  become_user: www-data

- name: Extract static subdirectory
  synchronize:
    src: '{{ static_root_path }}/repo/{{ static_name }}/{{ static_path }}/'
    dest: '{{ static_root_path }}/live/{{ static_name }}/'
    delete: yes
    recursive: yes
    owner: yes
    rsync_opts:
      - '--exclude=".*"'
      - '--filter="P data/**"'
  delegate_to: '{{ inventory_hostname }}'
  when: 'static_repo is defined'
  become: yes
