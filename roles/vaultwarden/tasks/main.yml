- name: Prepare Vaultwarden base directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - path: '{{ vaultwarden_root_path }}'
      mode: '0755'
    - path: '{{ vaultwarden_root_path }}/{{ vaultwarden_name }}'
      mode: '0755'
    - path: '{{ vaultwarden_root_path }}/{{ vaultwarden_name }}/data'
      mode: '0700'
  become: yes

- name: Configure docker compose for Vaultwarden
  template:
    src: '{{ item.name }}.j2'
    dest: '{{ vaultwarden_root_path }}/{{ vaultwarden_name }}/{{ item.name }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - name: docker-compose.yml
      mode: '0644'
    - name: ENV
      mode: '0600'
  become: yes

- name: Install Vaultwarden service file
  template:
    src: vaultwarden@.service.j2
    dest: '/etc/systemd/system/vaultwarden@.service'
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Restart Vaultwarden services
  service:
    name: 'vaultwarden@{{ vaultwarden_name }}'
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes
