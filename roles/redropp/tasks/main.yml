- name: Install packages
  apt:
    update_cache: no
    pkg:
      - git
      - clang
      - lld
      - gcc
      - g++
      - unzip
    state: latest
  become: yes

- name: Create redropp user
  user:
    name: redropp
    create_home: no
    home: /nonexistent
    shell: /usr/sbin/nologin
    system: yes
  register: redropp_user
  become: yes

- name: Prepare Redropp installation directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ redropp_root_path }}'
    - '{{ redropp_root_path }}/{{ redropp_name }}'
  become: yes

- name: Prepare Redropp data directories
  file:
    path: '{{ item }}'
    state: directory
    owner: redropp
    group: redropp
    mode: '0755'
  loop:
    - '{{ redropp_root_path }}/{{ redropp_name }}/data'
    - '{{ redropp_root_path }}/{{ redropp_name }}/tmp'
  become: yes

- name: Prepare Redropp repository directory
  file:
    path: '{{ redropp_root_path }}/repo'
    state: directory
    owner: '{{ ansible_user | default(lookup("env", "USER"), True) }}'
  become: yes

- name: Fetch Redropp repository
  git:
    repo: '{{ redropp_repo }}'
    version: '{{ redropp_commit }}'
    dest: '{{ redropp_root_path }}/repo'
    force: yes
  become: no

- name: Update configuration files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - src: redropp.ini.j2
      dest: '{{ redropp_root_path }}/{{ redropp_name }}/redropp.ini'
      mode: '0644'
    - src: redropp@.service.j2
      dest: /etc/systemd/system/redropp@.service
      mode: '0644'
  register: upload_config
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: upload_config.changed
  become: yes

- name: Bootstrap Felix
  shell:
    cmd: '{{ redropp_root_path }}/repo/bootstrap.sh'
    chdir: '{{ redropp_root_path }}/repo'
  when: 'not ansible_check_mode'
  become: no

- name: Build Redropp
  command:
    cmd: '{{ redropp_root_path }}/repo/felix -pParanoid --host=:clang:lld redropp'
    chdir: '{{ redropp_root_path }}/repo'
  register: build_redropp
  changed_when: 'build_redropp.stderr_lines[-1] != "Nothing to do!" and build_redropp.stderr_lines[-2] != "Nothing to do!"'
  become: no

- name: Install Redropp
  copy:
    src: '{{ redropp_root_path }}/repo/bin/Paranoid/redropp'
    remote_src: yes
    dest: '{{ redropp_root_path }}/redropp'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Enable Redropp service
  service:
    name: 'redropp@{{ redropp_name }}'
    enabled: yes
  become: yes

- name: Restart Redropp
  service:
    name: 'redropp@{{ redropp_name }}'
    state: restarted
  when: 'not ansible_check_mode'
  become: yes
