- name: Fetch SURY repository key
  get_url:
    url: https://packages.sury.org/php/apt.gpg
    dest: /usr/share/keyrings/deb.sury.org-php.gpg
  become: yes

- name: Configure SURY repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/deb.sury.org-php.gpg] https://packages.sury.org/php/ {{ ansible_facts["distribution_release"] }} main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: no
    pkg:
      - php8.4-cli
      - php8.4-mysql
      - php8.4-curl
      - php8.4-gd
      - php8.4-intl
      - php8.4-xml
      - php8.4-sqlite3
      - php8.4-fpm
      - php8.4-imagick
      - php8.4-mbstring
      - php8.4-zip
    state: latest
  become: yes

- name: Prepare WordPress base directory
  file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '0755'
  loop:
    - path: '{{ wordpress_root_path }}'
      owner: root
      group: root
    - path: '{{ wordpress_root_path }}/{{ wordpress_name }}'
      owner: root
      group: root
    - path: '{{ wordpress_root_path }}/{{ wordpress_name }}/new'
      owner: root
      group: root
    - path: '{{ wordpress_root_path }}/{{ wordpress_name }}/wordpress'
      owner: www-data
      group: www-data
  become: yes

- name: Fetch WordPress archive
  get_url:
    url: '{{ wordpress_url }}'
    dest: '{{ wordpress_root_path }}/{{ wordpress_name }}.tar.gz'
    checksum: '{{ wordpress_checksum }}'
  become: yes

- name: Extract WordPress archive
  unarchive:
    src: '{{ wordpress_root_path }}/{{ wordpress_name }}.tar.gz'
    dest: '{{ wordpress_root_path }}/{{ wordpress_name }}/new'
    remote_src: yes
    owner: www-data
    group: www-data
    mode: 'u=rwX,g=rX,o=rX'
    extra_opts:
      - '--strip-components=1'
  become: yes

- name: Synchronize WordPress install
  synchronize:
    src: '{{ wordpress_root_path }}/{{ wordpress_name }}/new/'
    dest: '{{ wordpress_root_path }}/{{ wordpress_name }}/wordpress/'
    delete: yes
    recursive: yes
    owner: true
    group: true
    rsync_opts:
      - "--exclude=wp-content"
  delegate_to: '{{ inventory_hostname }}'
  become: yes

- name: Generate random salts
  block:
  - name: Generate random salts 1/4
    stat:
      path: '{{ wordpress_root_path }}/{{ wordpress_name }}/salt'
    register: salt1
    become: yes
  - name: Generate random salts 2/4
    get_url:
      url: 'https://api.wordpress.org/secret-key/1.1/salt'
      dest: '{{ wordpress_root_path }}/{{ wordpress_name }}/salt'
      owner: root
      group: root
      mode: '0644'
    when: 'not salt1.stat.exists'
    become: yes
  - name: Generate random salts 3/4
    slurp:
      src: '{{ wordpress_root_path }}/{{ wordpress_name }}/salt'
    register: salt2
    become: yes
  - name: Generate random salts 4/4
    set_fact:
      wordpress_salts: '{{ salt2.content | b64decode }}'

- name: Configure WordPress
  template:
    src: wp-config.php.j2
    dest: '{{ wordpress_root_path }}/{{ wordpress_name }}/wordpress/wp-config.php'
    owner: root
    group: www-data
    mode: '0640'
  become: yes

- name: Configure PHP-FPM pool
  template:
    src: fpm.conf.j2
    dest: /etc/php/8.4/fpm/pool.d/wordpress.conf
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Restart PHP-FPM service
  service:
    name: php8.4-fpm
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes
