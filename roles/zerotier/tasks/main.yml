- name: Configure ZeroTier repository key
  apt_key:
    url: 'https://raw.githubusercontent.com/zerotier/ZeroTierOne/master/doc/contact%40zerotier.com.gpg'
    id: 23E52A61
    state: present
  become: yes

- name: Install ZeroTier One
  apt:
    update_cache: yes
    pkg:
      - zerotier-one
      - xz-utils
    state: latest
  become: yes

- name: Prepare ztncui base directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - path: '{{ ztncui_root_path }}/'
      mode: '0700'
    - path: '{{ ztncui_root_path }}/backups'
      mode: '0700'
  become: yes

- name: Fetch ztncui package
  get_url:
    url: '{{ ztncui_url }}'
    dest: '{{ ztncui_root_path }}/ztncui.deb'
    checksum: '{{ ztncui_checksum }}'
  become: yes

- name: Install ztncui
  apt:
    deb: '{{ ztncui_root_path }}/ztncui.deb'
    state: present
  become: yes

- name: Read ZeroTier secret token
  slurp:
    src: /var/lib/zerotier-one/authtoken.secret
  register: authtoken
  become: yes

- name: Configure ztncui
  template:
    src: ztncui.env.j2
    dest: '/opt/key-networks/ztncui/.env'
    owner: ztncui
    group: ztncui
    mode: '0600'
  become: yes

- name: Check for default ztncui password
  lineinfile:
    name: /opt/key-networks/ztncui/etc/passwd
    line: '"pass_set":true'
    state: absent
  check_mode: yes
  register: default_pwd
  become: yes

- name: Replace default ztncui password
  template:
    src: passwd
    dest: /opt/key-networks/ztncui/etc/passwd
    owner: ztncui
    group: ztncui
    mode: '0600'
  when: 'default_pwd.changed'
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Restart ztncui services
  service:
    name: 'ztncui'
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes
