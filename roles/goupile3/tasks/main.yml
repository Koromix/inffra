- name: Fetch koromix.dev repository key
  get_url:
    url: https://download.koromix.dev/debian/koromix-archive-keyring.gpg
    dest: /usr/share/keyrings/koromix-archive-keyring.gpg
  become: yes

- name: Configure koromix.dev repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/koromix-archive-keyring.gpg] https://download.koromix.dev/debian stable main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - goupile
    state: latest
  become: yes

- name: Configure config template
  copy:
    dest: /etc/goupile/template.ini
    owner: root
    group: root
    mode: '0600'
    content: '{{ goupile_template }}'
  when: 'goupile_template is defined'
  become: yes

- name: Configure domain
  template:
    src: domain.ini.j2
    dest: '/etc/goupile/domains.d/{{ goupile_name }}.ini'
    owner: root
    group: root
    mode: '0600'
  become: yes

- name: Sync Goupile services
  command: 'true'
  changed_when: 'not ansible_check_mode'
  notify: 'Sync Goupile'
