- name: Configure socat user
  user:
    name: socat
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - socat
    state: latest
  become: yes

- name: Prepare socat base directory
  file:
    path: '{{ socat_root_path }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Update configuration files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - src: socat.sh.j2
      dest: '{{ socat_root_path }}/{{ socat_name }}.sh'
      mode: '0755'
    - src: socat@.service.j2
      dest: /etc/systemd/system/socat@.service
      mode: '0644'
  become: yes

- name: Restart socat service
  service:
    name: 'socat@{{ socat_name }}.service'
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes
