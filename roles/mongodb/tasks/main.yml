- name: Configure MongoDB repository key
  apt_key:
    url: 'https://www.mongodb.org/static/pgp/server-{{ mongodb_version }}.asc'
    id: '{{ mongodb_key_id }}'
    state: present
  become: yes

- name: Configure MongoDB repository
  apt_repository:
    repo: 'deb http://repo.mongodb.org/apt/debian {{ ansible_distribution_release }}/mongodb-org/{{ mongodb_version }} main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - mongodb-org
    state: latest
  become: yes

- name: Bind MongoDB to Docker address
  lineinfile:
    dest: /etc/mongod.conf
    regexp: '^  bindIp:'
    line: '  bindIp: 172.17.0.1'
    state: present
  become: yes

- name: Start MongoDB after Docker (1)
  file:
    path: /etc/systemd/system/mongod.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Start MongoDB after Docker (2)
  copy:
    content: |
      [Unit]
      After=docker.service
    dest: /etc/systemd/system/mongod.service.d/override.conf
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Restart MongoDB service
  service:
    name: mongod
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Set self-managed replica set name
  blockinfile:
    path: /etc/mongod.conf
    block: |
      replication:
        replSetName: "rs0"
    state: present
  become: yes

- name: Enable self-managed replica set
  shell: |
    mongosh mongodb://172.17.0.1 --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '172.17.0.1:27017' }] })"
  ignore_errors: yes
  become: yes

- name: Create backup directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - path: '{{ mongodb_backup_path }}'
      mode: '0755'
    - path: '{{ mongodb_backup_path }}/backups'
      mode: '0700'
  become: yes

- name: Create backup script
  template:
    src: backup.sh.j2
    dest: '{{ mongodb_backup_path }}/backup.sh'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Install scheduled backup systemd units
  template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - mongodb_backup.service
    - mongodb_backup.timer
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Enabled scheduled backups
  service:
    name: mongodb_backup.timer
    state: started
    enabled: yes
  become: yes
