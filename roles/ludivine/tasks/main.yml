- name: Install packages
  apt:
    update_cache: no
    pkg:
      - git
      - clang
      - lld
      - gcc
      - g++
      - unzip
    state: latest
  become: yes

- name: Create ludivine user
  user:
    name: ludivine
    create_home: no
    home: /nonexistent
    shell: /usr/sbin/nologin
    system: yes
  register: ludivine_user
  become: yes

- name: Prepare ludivine installation directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ ludivine_root_path }}'
    - '{{ ludivine_root_path }}/{{ ludivine_name }}'
  become: yes

- name: Prepare ludivine data directories
  file:
    path: '{{ item }}'
    state: directory
    owner: ludivine
    group: ludivine
    mode: '0755'
  loop:
    - '{{ ludivine_root_path }}/{{ ludivine_name }}/data'
    - '{{ ludivine_root_path }}/{{ ludivine_name }}/tmp'
  become: yes

- name: Prepare ludivine repository directory
  file:
    path: '{{ ludivine_root_path }}/repo'
    state: directory
    owner: '{{ ansible_user | default(lookup("env", "USER"), True) }}'
  become: yes

- name: Fetch ludivine repository
  git:
    repo: '{{ ludivine_repo }}'
    version: '{{ ludivine_commit }}'
    dest: '{{ ludivine_root_path }}/repo'
    force: yes
  become: no

- name: Update configuration files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - src: ludivine.ini.j2
      dest: '{{ ludivine_root_path }}/{{ ludivine_name }}/ludivine.ini'
      mode: '0644'
    - src: ludivine@.service.j2
      dest: /etc/systemd/system/ludivine@.service
      mode: '0644'
  register: upload_config
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: upload_config.changed
  become: yes

- name: Bootstrap Felix
  shell:
    cmd: '{{ ludivine_root_path }}/repo/bootstrap.sh'
    chdir: '{{ ludivine_root_path }}/repo'
  when: 'not ansible_check_mode'
  become: no

- name: Build Ludivine
  command:
    cmd: '{{ ludivine_root_path }}/repo/felix -pParanoid --host=:clang:lld ludivine'
    chdir: '{{ ludivine_root_path }}/repo'
  register: build_ludivine
  changed_when: 'build_ludivine.stderr_lines[-1] != "Nothing to do!" and build_ludivine.stderr_lines[-2] != "Nothing to do!"'
  become: no

- name: Install Ludivine
  copy:
    src: '{{ ludivine_root_path }}/repo/bin/Paranoid/ludivine'
    remote_src: yes
    dest: '{{ ludivine_root_path }}/ludivine'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Create Ludivine binary link
  file:
    path: '{{ ludivine_root_path }}/{{ ludivine_name }}/ludivine'
    src: '{{ ludivine_root_path }}/ludivine'
    state: link
  become: yes

- name: Enable Ludivine service
  service:
    name: 'ludivine@{{ ludivine_name }}'
    enabled: yes
  become: yes

- name: Restart Ludivine
  service:
    name: 'ludivine@{{ ludivine_name }}'
    state: restarted
  when: build_ludivine.changed
  become: yes
