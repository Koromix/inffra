- name: Prepare Tolgee base directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - path: '{{ tolgee_root_path }}'
      mode: '0755'
    - path: '{{ tolgee_root_path }}/{{ tolgee_name }}'
      mode: '0755'
    - path: '{{ tolgee_root_path }}/{{ tolgee_name }}/data'
      mode: '0700'
  become: yes

- name: Configure docker compose for Tolgee
  template:
    src: '{{ item.name }}.j2'
    dest: '{{ tolgee_root_path }}/{{ tolgee_name }}/{{ item.name }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - name: docker-compose.yml
      mode: '0644'
    - name: config.yaml
      mode: '0600'
  become: yes

- name: Install Tolgee service file
  template:
    src: tolgee@.service.j2
    dest: '/etc/systemd/system/tolgee@.service'
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Restart Tolgee services
  service:
    name: 'tolgee@{{ tolgee_name }}'
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes
