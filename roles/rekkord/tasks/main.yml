- name: Fetch koromix.dev repository key
  get_url:
    url: https://download.koromix.dev/debian/koromix-archive-keyring.gpg
    dest: /usr/share/keyrings/koromix-archive-keyring.gpg
  become: yes

- name: Configure koromix.dev repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/koromix-archive-keyring.gpg] https://download.koromix.dev/debian stable main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - xz-utils
      - rekkord
    state: latest
  become: yes

- name: Prepare rekkord base directory
  file:
    path: '{{ rekkord_root_path }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Create rekkord config file
  template:
    src: config.ini.j2
    dest: '{{ rekkord_root_path }}/config.ini'
    owner: root
    group: root
    mode: '0600'
  become: yes

- name: Write rekkord keyfile
  copy:
    content: '{{ rekkord_key }}'
    dest: '{{ rekkord_root_path }}/rekkord.key'
    owner: root
    group: root
    mode: '0600'
  become: yes

- name: Delete old config files
  file:
    path: '{{ item }}'
    state: absent
  loop:
    - '{{ rekkord_root_path }}/ENV'
    - '{{ rekkord_root_path }}/rekkord.sh'
  become: yes

- name: Install scheduled backup systemd units
  template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - rekkord.service
    - rekkord.timer
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Enabled scheduled rekkord sync
  service:
    name: rekkord.timer
    state: started
    enabled: yes
  become: yes
