- name: Fetch koromix.dev repository key
  get_url:
    url: https://download.koromix.dev/debian/koromix-archive-keyring.gpg
    dest: /usr/share/keyrings/koromix-archive-keyring.gpg
  become: yes

- name: Configure koromix.dev repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/koromix-archive-keyring.gpg] https://download.koromix.dev/debian stable main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: no
    pkg:
      - git
      - clang
      - lld
      - gcc
      - g++
      - unzip
      - felix
    state: latest
  become: yes

- name: Create medita user
  user:
    name: medita
    create_home: no
    home: /nonexistent
    shell: /usr/sbin/nologin
    system: yes
  register: medita_user
  become: yes

- name: Prepare Medita installation directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ medita_root_path }}'
    - '{{ medita_root_path }}/{{ medita_name }}'
  become: yes

- name: Prepare Medita data directories
  file:
    path: '{{ item }}'
    state: directory
    owner: medita
    group: medita
    mode: '0755'
  loop:
    - '{{ medita_root_path }}/{{ medita_name }}/data'
    - '{{ medita_root_path }}/{{ medita_name }}/tmp'
  become: yes

- name: Prepare CALYPSO repository directory
  file:
    path: '{{ medita_root_path }}/repo'
    state: directory
    owner: '{{ ansible_user | default(lookup("env", "USER"), True) }}'
  become: yes

- name: Fetch CALYPSO repository
  git:
    repo: '{{ medita_repo }}'
    version: '{{ medita_commit }}'
    dest: '{{ medita_root_path }}/repo'
    force: yes
  become: no

- name: Update configuration files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - src: medita.ini.j2
      dest: '{{ medita_root_path }}/{{ medita_name }}/medita.ini'
      mode: '0644'
    - src: medita@.service.j2
      dest: /etc/systemd/system/medita@.service
      mode: '0644'
  register: upload_config
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: upload_config.changed
  become: yes

- name: Build Medita
  command:
    cmd: 'felix -pParanoid --host=:clang:lld medita'
    chdir: '{{ medita_root_path }}/repo'
  register: build_medita
  changed_when: 'build_medita.stderr_lines[-1] != "Nothing to do!" and build_medita.stderr_lines[-2] != "Nothing to do!"'
  become: no

- name: Install Medita
  copy:
    src: '{{ medita_root_path }}/repo/bin/Paranoid/medita'
    remote_src: yes
    dest: '{{ medita_root_path }}/medita'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Enable Medita service
  service:
    name: 'medita@{{ medita_name }}'
    enabled: yes
  become: yes

- name: Restart Medita
  service:
    name: 'medita@{{ medita_name }}'
    state: restarted
  when: build_medita.changed
  become: yes
