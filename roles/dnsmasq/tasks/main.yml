- name: Install packages
  package:
    update_cache: yes
    pkg:
      - dnsmasq
    state: latest
  become: yes

- name: Configure DNS server
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
  loop:
    - src: dnsmasq.conf.j2
      dest: /etc/dnsmasq.conf
    - src: hosts.conf.j2
      dest: /etc/dnsmasq_hosts.conf
  become: yes

- name: Reload DNS server
  service:
    name: nginx
    state: reloaded
  when: 'not ansible_check_mode'
  become: yes
