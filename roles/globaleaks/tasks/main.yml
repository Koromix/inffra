- name: Install packages
  apt:
    update_cache: yes
    pkg:
      - wget
      - rsync
      - sqlite3
    state: latest
  become: yes

- name: Install Globaleaks
  shell:
    cmd: |
      wget https://deb.globaleaks.org/install-globaleaks.sh
      /bin/bash ./install-globaleaks.sh
    chdir: /tmp
    creates: /usr/bin/globaleaks
  become: yes

- name: Create backup directories
  file:
    path: '{{ item.path }}'
    state: directory
    owner: '{{ item.owner }}'
    group: '{{ item.group }}'
    mode: '{{ item.mode }}'
  loop:
    - path: '{{ globaleaks_backup_path }}'
      owner: root
      group: root
      mode: '0755'
    - path: '{{ globaleaks_backup_path }}/globaleaks'
      owner: globaleaks
      group: globaleaks
      mode: '0755'
    - path: '{{ globaleaks_backup_path }}/backups'
      owner: root
      group: root
      mode: '0700'
  become: yes

- name: Create backup script
  template:
    src: backup.sh.j2
    dest: '{{ globaleaks_backup_path }}/backup.sh'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Install scheduled backup systemd units
  template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - globaleaks_backup.service
    - globaleaks_backup.timer
  register: service_config
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: service_config.changed
  become: yes

- name: Enabled scheduled backups
  service:
    name: globaleaks_backup.timer
    state: started
    enabled: yes
  become: yes
