- name: Configure mattermost user
  user:
    name: mattermost
    state: present
  become: yes

- name: Prepare Mattermost base directory
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ mattermost_root_path }}'
    - '{{ mattermost_root_path }}/{{ mattermost_name }}'
    - '{{ mattermost_root_path }}/{{ mattermost_name }}/app'
  become: yes

- name: Prepare Mattermost data directory
  file:
    path: '{{ mattermost_root_path }}/{{ mattermost_name }}/data'
    state: directory
    owner: mattermost
    group: mattermost
    mode: '0755'
  become: yes

- name: Fetch Mattermost archive
  get_url:
    url: '{{ mattermost_url }}'
    dest: '{{ mattermost_root_path }}/{{ mattermost_name }}.tar.gz'
    checksum: '{{ mattermost_checksum }}'
  become: yes

- name: Install Mattermost
  unarchive:
    src: '{{ mattermost_root_path }}/{{ mattermost_name }}.tar.gz'
    dest: '{{ mattermost_root_path }}/{{ mattermost_name }}/app'
    remote_src: yes
    owner: mattermost
    group: mattermost
    mode: 'u=rwX,g=rX,o=rX'
    extra_opts:
      - '--strip-components=1'
  become: yes

- name: Install Mattermost service file
  template:
    src: mattermost@.service.j2
    dest: '/etc/systemd/system/mattermost@.service'
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Configure Mattermost
  template:
    src: config.json.j2
    dest: '{{ mattermost_root_path }}/{{ mattermost_name }}/app/config/config.json'
    owner: mattermost
    group: mattermost
    mode: '0644'
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Restart Mattermost services
  service:
    name: 'mattermost@{{ mattermost_name }}'
    state: restarted
    enabled: yes
  when: 'not ansible_check_mode'
  become: yes
