- name: Create LEGO root directory
  file:
    path: '{{ lego_root_path }}'
    state: directory
    mode: '0755'
  become: yes

- name: Create LEGO renewal script
  template:
    src: lego.renew.j2
    dest: '{{ lego_root_path }}/renew'
    owner: root
    group: root
    mode: '0700'
  become: yes

- name: Obtain new LEGO certificates
  shell:
    cmd: '/usr/bin/lego -a {{ lego_settings[item.lego].command }} {{ item.name }} run'
    chdir: '{{ lego_root_path }}'
    creates: '{{ lego_root_path }}/.lego/certificates/{{ item.name }}.crt'
  environment: '{{ item.environment | default({}) }}'
  loop: '{{ dns_domains }}'
  when: 'item.lego is defined'
  become: yes

- name: Install scheduled LEGO systemd units
  template:
    src: '{{ item }}.j2'
    dest: '/etc/systemd/system/{{ item }}'
    owner: root
    group: root
    mode: '0644'
  loop:
    - lego.service
    - lego.timer
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: 'not ansible_check_mode'
  become: yes

- name: Enabled scheduled renewals
  service:
    name: lego.timer
    state: started
    enabled: yes
  become: yes
