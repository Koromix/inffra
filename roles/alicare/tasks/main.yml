- name: Fetch koromix.dev repository key
  get_url:
    url: https://download.koromix.dev/debian/koromix-archive-keyring.gpg
    dest: /usr/share/keyrings/koromix-archive-keyring.gpg
  become: yes

- name: Configure koromix.dev repository
  apt_repository:
    repo: 'deb [signed-by=/usr/share/keyrings/koromix-archive-keyring.gpg] https://download.koromix.dev/debian stable main'
    state: present
  become: yes

- name: Install packages
  apt:
    update_cache: no
    pkg:
      - git
      - clang
      - lld
      - gcc
      - g++
      - unzip
      - felix
    state: latest
  become: yes

- name: Create alicare user
  user:
    name: alicare
    create_home: no
    home: /nonexistent
    shell: /usr/sbin/nologin
    system: yes
  register: alicare_user
  become: yes

- name: Prepare ALI-Care installation directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ alicare_root_path }}'
    - '{{ alicare_root_path }}/{{ alicare_name }}'
  become: yes

- name: Prepare ALI-Care data directories
  file:
    path: '{{ item }}'
    state: directory
    owner: alicare
    group: alicare
    mode: '0755'
  loop:
    - '{{ alicare_root_path }}/{{ alicare_name }}/data'
    - '{{ alicare_root_path }}/{{ alicare_name }}/tmp'
  become: yes

- name: Prepare CALYPSO repository directory
  file:
    path: '{{ alicare_root_path }}/repo'
    state: directory
    owner: '{{ ansible_user | default(lookup("env", "USER"), True) }}'
  become: yes

- name: Fetch CALYPSO repository
  git:
    repo: '{{ alicare_repo }}'
    version: '{{ alicare_commit }}'
    dest: '{{ alicare_root_path }}/repo'
    force: yes
  become: no

- name: Update configuration files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - src: alicare.ini.j2
      dest: '{{ alicare_root_path }}/{{ alicare_name }}/alicare.ini'
      mode: '0644'
    - src: alicare@.service.j2
      dest: /etc/systemd/system/alicare@.service
      mode: '0644'
  register: upload_config
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: upload_config.changed
  become: yes

- name: Build ALI-Care
  command:
    cmd: 'felix -pParanoid --host=:clang:lld alicare'
    chdir: '{{ alicare_root_path }}/repo'
  register: build_alicare
  changed_when: 'build_alicare.stderr_lines[-1] != "Nothing to do!" and build_alicare.stderr_lines[-2] != "Nothing to do!"'
  become: no

- name: Install ALI-Care
  copy:
    src: '{{ alicare_root_path }}/repo/bin/Paranoid/alicare'
    remote_src: yes
    dest: '{{ alicare_root_path }}/alicare'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Enable ALI-Care service
  service:
    name: 'alicare@{{ alicare_name }}'
    enabled: yes
  become: yes

- name: Restart ALI-Care
  service:
    name: 'alicare@{{ alicare_name }}'
    state: restarted
  when: build_alicare.changed
  become: yes
