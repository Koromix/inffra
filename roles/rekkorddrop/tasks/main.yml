- name: Install packages
  apt:
    update_cache: no
    pkg:
      - git
      - clang
      - lld
      - gcc
      - g++
      - unzip
    state: latest
  become: yes

- name: Create rekkorddrop user
  user:
    name: rekkorddrop
    create_home: no
    home: /nonexistent
    shell: /usr/sbin/nologin
    system: yes
  register: rekkorddrop_user
  become: yes

- name: Prepare Rekkord Drop installation directories
  file:
    path: '{{ item }}'
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - '{{ rekkorddrop_root_path }}'
    - '{{ rekkorddrop_root_path }}/{{ rekkorddrop_name }}'
  become: yes

- name: Prepare Rekkord Drop data directories
  file:
    path: '{{ item }}'
    state: directory
    owner: rekkorddrop
    group: rekkorddrop
    mode: '0755'
  loop:
    - '{{ rekkorddrop_root_path }}/{{ rekkorddrop_name }}/data'
    - '{{ rekkorddrop_root_path }}/{{ rekkorddrop_name }}/tmp'
  become: yes

- name: Prepare Rekkord Drop repository directory
  file:
    path: '{{ rekkorddrop_root_path }}/repo'
    state: directory
    owner: '{{ ansible_user | default(lookup("env", "USER"), True) }}'
  become: yes

- name: Fetch Rekkord Drop repository
  git:
    repo: '{{ rekkorddrop_repo }}'
    version: '{{ rekkorddrop_commit }}'
    dest: '{{ rekkorddrop_root_path }}/repo'
    force: yes
  become: no

- name: Update configuration files
  template:
    src: '{{ item.src }}'
    dest: '{{ item.dest }}'
    owner: root
    group: root
    mode: '{{ item.mode }}'
  loop:
    - src: RekkordDrop.ini.j2
      dest: '{{ rekkorddrop_root_path }}/{{ rekkorddrop_name }}/RekkordDrop.ini'
      mode: '0644'
    - src: rekkorddrop@.service.j2
      dest: /etc/systemd/system/rekkorddrop@.service
      mode: '0644'
  register: upload_config
  become: yes

- name: Reload systemd units
  systemd:
    daemon_reload: yes
  when: upload_config.changed
  become: yes

- name: Bootstrap Felix
  shell:
    cmd: '{{ rekkorddrop_root_path }}/repo/bootstrap.sh'
    chdir: '{{ rekkorddrop_root_path }}/repo'
  when: 'not ansible_check_mode'
  become: no

- name: Build Rekkord Drop
  command:
    cmd: '{{ rekkorddrop_root_path }}/repo/felix -pParanoid --host=:clang:lld RekkordDrop'
    chdir: '{{ rekkorddrop_root_path }}/repo'
  register: build_rekkorddrop
  changed_when: 'build_rekkorddrop.stderr_lines[-1] != "Nothing to do!" and build_rekkorddrop.stderr_lines[-2] != "Nothing to do!"'
  become: no

- name: Install Rekkord Drop
  copy:
    src: '{{ rekkorddrop_root_path }}/repo/bin/Paranoid/RekkordDrop'
    remote_src: yes
    dest: '{{ rekkorddrop_root_path }}/RekkordDrop'
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Enable Rekkord Drop service
  service:
    name: 'rekkorddrop@{{ rekkorddrop_name }}'
    enabled: yes
  become: yes

- name: Restart Rekkord Drop
  service:
    name: 'rekkorddrop@{{ rekkorddrop_name }}'
    state: restarted
  when: 'not ansible_check_mode'
  become: yes
