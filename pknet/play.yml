- name: Global configuration
  hosts: all
  roles:
    - name: base
    - name: nginx
      when: 'nginx_domains is defined'
    - name: prometheus
      when: 'prometheus_exporters is defined or grafana_url is defined'
  tags: [system]

- name: Rekkord
  hosts: all
  roles:
    - name: rekkord
      when: 'rekkord_directories is defined'
  tags: [system, rekkord]

- import_playbook: 'config/services/goupile.yml'
- import_playbook: 'config/services/static.yml'
- import_playbook: 'config/services/lufi.yml'
- import_playbook: 'config/services/napka.yml'
- import_playbook: 'config/services/thop.yml'
- import_playbook: 'config/services/rekkow.yml'
- import_playbook: 'config/services/forgejo.yml'
- import_playbook: 'config/services/wordpress.yml'
- import_playbook: 'config/services/discourse.yml'
- import_playbook: 'config/services/nextcloud.yml'
- import_playbook: 'config/services/mattermost.yml'
- import_playbook: 'config/services/cryptpad.yml'
- import_playbook: 'config/services/vaultwarden.yml'
- import_playbook: 'config/services/tolgee.yml'
- import_playbook: 'config/services/photoview.yml'
