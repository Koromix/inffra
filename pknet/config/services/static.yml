- name: goupile.org
  hosts: aeryn
  roles:
    - role: ../../../../roles/static
      vars:
        static_name: goupile.org/files
    - role: ../../../../roles/static
      vars:
        static_name: goupile.org/www
        static_repo: https://github.com/Koromix/rygel.git
        static_path: web/goupile.org/dist
        static_build:
          - cmd: '{{ static_root_path }}/repo/goupile.org/www/bootstrap.sh'
            chdir: '{{ static_root_path }}/repo/goupile.org/www'
          - cmd: '/usr/bin/rm -rf {{ static_root_path }}/repo/goupile.org/www/web/goupile.org/dist'
            chdir: '{{ static_root_path }}/repo/goupile.org/www'
          - cmd: '{{ static_root_path }}/repo/goupile.org/www/felix -pFast --run_here hodler . -O dist --gzip'
            chdir: '{{ static_root_path }}/repo/goupile.org/www/web/goupile.org'
  tags: [goupile.org, static]

