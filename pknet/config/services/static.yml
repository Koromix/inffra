- name: goupile.org
  hosts: monitor
  roles:
    - role: ../../../../roles/static
      vars:
        static_name: goupile.org/www
        static_repo: https://github.com/Koromix/rygel.git
        static_version: goupile2
        static_path: web/goupile.org
    - role: ../../../../roles/static
      vars:
        static_name: goupile.org/files
    - role: ../../../../roles/static
      vars:
        static_name: goupile.org/doc
        static_repo: https://github.com/Koromix/rygel.git
        static_path: web/goupile.org/fr/dist/html
        static_build:
          - cmd: '{{ static_root_path }}/poetry/bin/poetry install'
            chdir: '{{ static_root_path }}/repo/goupile.org/doc/web/goupile.org/fr'
          - cmd: '{{ static_root_path }}/poetry/bin/poetry run make clean'
            chdir: '{{ static_root_path }}/repo/goupile.org/doc/web/goupile.org/fr'
          - cmd: '{{ static_root_path }}/poetry/bin/poetry run make html'
            chdir: '{{ static_root_path }}/repo/goupile.org/doc/web/goupile.org/fr'
  tags: [static]

- name: koromix.dev
  hosts: monitor
  roles:
    - role: ../../../../roles/static
      vars:
        static_name: koromix.dev/www
        static_repo: https://github.com/Koromix/rygel.git
        static_path: web/koromix.dev/dist
        static_build:
          - cmd: '{{ static_root_path }}/repo/koromix.dev/www/bootstrap.sh'
            chdir: '{{ static_root_path }}/repo/koromix.dev/www'
          - cmd: '/usr/bin/rm -rf {{ static_root_path }}/repo/koromix.dev/www/web/koromix.dev/dist'
            chdir: '{{ static_root_path }}/repo/koromix.dev/www'
          - cmd: '{{ static_root_path }}/repo/koromix.dev/www/felix -pFast --run_here hodler . -O dist --gzip'
            chdir: '{{ static_root_path }}/repo/koromix.dev/www/web/koromix.dev'
    - role: ../../../../roles/static 
      vars:
        static_name: koromix.dev/files
    - role: ../../../../roles/static 
      vars:
        static_name: koromix.dev/test
  tags: [static]

