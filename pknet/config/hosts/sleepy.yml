nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      ssl_client_certificate /opt/nginx/ssl/internal/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;

      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.aeryn.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

      {% if blackbox_sites is defined %}

      location /metrics/probe {
          allow {{ hostvars.aeryn.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:{{ prometheus_packages.blackbox_exporter.port }}/probe$is_args$args;
      }
      {% endif %}

      location /R/ {
          proxy_pass http://127.0.0.1:3838/;
      }

      location /procemot/ {
          client_max_body_size 256M;
          proxy_pass http://127.0.0.1:9999;
      }

      location /files/ {
          alias /opt/files/;

          location ~ ^/files/[a-zA-Z0-9_]+/ {
              autoindex on;
              autoindex_exact_size off;
          }
      }

      location /photo/ {
          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;

          proxy_pass http://127.0.0.1:8134/;
          proxy_http_version 1.1;
      }

      location /download/ {
          alias /opt/download/;

          autoindex on;
          autoindex_exact_size on;
      }

prometheus_exporters:
  - node_exporter
  - nginx_exporter
  - systemd_exporter
  - blackbox_exporter

