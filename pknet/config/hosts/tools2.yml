nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      ssl_client_certificate /opt/nginx/ssl/internal/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;

      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.static.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: forum.f2rsmpsy.org
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          # limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://unix:/opt/discourse/f2rsmpsy/shared/nginx.http.sock:;
      }

  - name: cpad.f2rsmpsy.org
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          proxy_http_version    1.1;

          proxy_set_header      X-Real-IP $remote_addr;
          proxy_set_header      Host $host;
          proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
          client_max_body_size  150m;

          proxy_set_header      Upgrade $http_upgrade;
          proxy_set_header      Connection upgrade;

          proxy_pass            http://localhost:3000;
      }
  - name: cpadsb.f2rsmpsy.org
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          proxy_http_version    1.1;

          proxy_set_header      X-Real-IP $remote_addr;
          proxy_set_header      Host $host;
          proxy_set_header      X-Forwarded-For $proxy_add_x_forwarded_for;
          client_max_body_size  150m;

