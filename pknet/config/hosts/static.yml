nginx_config_misc: |
  map $upstream_http_content_security_policy $ldv_csp {
      '' "base-uri 'none'; default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self'; style-src-attr 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'; form-action 'none'";
  }

nginx_domains:
  - name: '{{ ansible_host }}'
    config: |
      ssl_client_certificate /opt/nginx/ssl/internal/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;

      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.static.ansible_host }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: goupile.fr
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          return 301 https://goupile.org$request_uri;
      }
  - name: www.goupile.fr
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          return 301 https://goupile.org$request_uri;
      }

  - name: goupile.org
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
      location / {
          index index.html;

          rewrite ^((?:/.+)*/[a-zA-Z0-9]+)$ $1.html;
          rewrite ^((?:/.+)*/[a-zA-Z0-9]+)/$ $1 permanent;
          try_files $uri $uri/ =404;

          root /opt/static/live/goupile.org/www;

          expires 1h;
          add_header Cache-Control "public, no-transform";

          gzip on;
          gzip_vary on;
          gzip_types text/html text/plain text/css text/xml text/javascript application/javascript application/xml image/svg+xml;
          gzip_proxied no-cache no-store private expired auth;
          gzip_min_length 1000;
          gzip_static on;

          location /static/ {
              expires 28d;
          }

          error_page 404 /404.html;

          location /en/ {
              rewrite ^((?:/.+)*/[a-zA-Z0-9]+)$ $1.html;
              rewrite ^((?:/.+)*/[a-zA-Z0-9]+)/$ $1 permanent;
              error_page 404 /en/404.html;
          }
      }

      location /files/ {
          alias /opt/static/live/goupile.org/files/;

          location ~ ^/files/[a-zA-Z0-9_]+/ {
              autoindex on;
              autoindex_exact_size off;
          }
      }
  - name: www.goupile.org
    ssl_certbot_email: niels.martignene@protonmail.com
    config: |
