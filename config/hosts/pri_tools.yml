dns_domains:
  - name: 'wekan.{{ private_domain }}'
    lego: gandi
  - name: 'vault.{{ private_domain }}'
    lego: gandi

nginx_public_addr: '{{ ansible_host }}'

nginx_domains:
  - name: '{{ prometheus_public_addr }}'
    config: |
      ssl_client_certificate /opt/nginx/ssl/internal/ca.crt;
      ssl_verify_client on;
      ssl_verify_depth 2;

      {% for exporter in prometheus_exporters %}

      location /metrics/{{ exporter }} {
          allow {{ hostvars.pri_tower.nginx_public_addr }};
          deny all;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:{{ prometheus_packages[exporter].port }}/metrics;
      }
      {% endfor %}

  - name: 'wekan.{{ private_domain }}'
    ssl_file_crt: '{{ lego_root_path }}/.lego/certificates/wekan.{{ private_domain }}.crt'
    ssl_file_key: '{{ lego_root_path }}/.lego/certificates/wekan.{{ private_domain }}.key'
    config: |
      location / {
          limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:6789;
      }

  - name: 'vault.{{ private_domain }}'
    ssl_file_crt: '{{ lego_root_path }}/.lego/certificates/vault.{{ private_domain }}.crt'
    ssl_file_key: '{{ lego_root_path }}/.lego/certificates/vault.{{ private_domain }}.key'
    config: |
      location / {
          limit_req zone=default burst=100 nodelay;

          proxy_set_header Host $host;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Real-IP $remote_addr;

          proxy_pass http://127.0.0.1:8285;
      }
