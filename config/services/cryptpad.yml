- name: Private Cryptpad
  hosts: pri_cpad
  roles:
    - role: ../../roles/cryptpad
      vars:
        cpad_name: team
        cpad_main_domain: 'cpad.{{ private_domain }}'
        cpad_safe_domain: 'cpadsb.{{ private_domain }}'
        cpad_admin_mail: 'admin@premla.fr'
  tags: [cryptpad]
